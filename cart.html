<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>LiShop</title>
        <link rel="icon" type="image/png" href="img\LiShopLightContentLogo.png">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="css/style.css">
        
    </head>

    <body>
        

        <header>
        <nav class="navbar" style="background-color: rgb(66, 66, 66);">
            <div class="container-fluid">
                <a class="navbar-brand"><img src="img\LiShopLightContentLogo.png" width="80px">
            </a>
            <form class="d-flex" role="search">
            <input class="form-control me-2 searchP" type="search" placeholder="Search" aria-label="Search"/>
            </form>
            <a class="btn btn-outline-success" href="index.html">На головну</a>
            </div>
            
        </nav>

        <!--  -->


    </header>

        
        <main>
            <div class="container-sm text-center" >
                <h1 class="title my-4">Ваші товари</h1>
                <div class="cart_container">
                    <h3>кошик порожній</h3>
                </div>
                <button type="button" class="btn btn-primary my-4" data-bs-toggle="modal" data-bs-target="#exampleModal">
                    Оформити замовлення
                </button>
            </div>
            
        </main>
        <!-- Button trigger modal -->
        

        <!-- Modal -->
        <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="exampleModalLabel">Оформлененя замовлення</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body order">
                Кошик пустий
            </div>
        </div>
        </div>

        <footer>

        </footer>




    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="js/script.js"></script>
    </body>
    
</html>
